# bdrep configuration. Every keyword list, weight and threshold lives here so
# tuning false positives never needs a code change. Terms are matched as whole
# words after lowercasing and replacing punctuation with spaces, so "arc-flash"
# and "arc flash" are the same term.

timezone: America/Los_Angeles

owner:
  name: Roben Mata, PE
  firm: Mata Engineering
  signature: |
    Roben Mata, PE
    Mata Engineering

# Target states and license status. Leads in a "pending" state are held: listed
# in the digest with no draft, because offering engineering services there
# before the license issues is prohibited (Florida: F.S. 471.031(1)(a) and the
# holding-out clause in 471.005). Flip FL to "licensed" the day it issues.
# A state's `note` is printed on every lead in that state.
states:
  CA:
    name: California
    license: licensed
  IL:
    name: Illinois
    license: licensed
    note: >-
      Confirm Mata Engineering is registered as a Professional
      Design Firm with IDFPR (225 ILCS 325/23) or is operating under your own
      name as a sole proprietor.
  FL:
    name: Florida
    license: pending
    note: >-
      HOLD: Florida PE license pending. Do not send any service offer or sign
      as an engineer for Florida work until the license issues.

store:
  path: data/leads.db
  # Fuzzy duplicate matching only looks back this far.
  dedupe_window_days: 120
  # SequenceMatcher ratio on normalized titles that counts as the same project.
  title_similarity: 0.88

digest:
  dir: digests
  # MVP success metric: genuinely relevant leads surfaced per week.
  weekly_target: 3

scoring:
  threshold: 60          # qualified at or above this; gets a draft
  near_miss_margin: 15   # listed (no draft) when within this many points below
  service_max: 50
  state_max: 20
  project_max: 30
  # State points when the state is known and licensed / pending / not detected.
  state_points: {licensed: 20, pending: 10, unknown: 5}

  # Service-line keywords. A "strong" term is close to a direct ask for the
  # service; a "weak" term is a project where the service is often needed.
  service_lines:
    arc_flash:
      label: Arc flash & short circuit studies
      strong:
        - arc flash
        - short circuit study
        - short circuit analysis
        - coordination study
        - protective device coordination
        - selective coordination
        - incident energy
        - ieee 1584
        - nfpa 70e
        - power system study
        - power systems study
        - electrical system study
        - power system analysis
        - "26 05 73"
        - "260573"
      weak:
        - switchgear
        - switchboard
        - medium voltage
        - substation
        - electrical distribution
        - electrical service upgrade
        - electrical upgrade
        - electrical upgrades
        - electrical modernization
        - battery energy storage
        - bess
        - data center
        - ups system
        - standby generator
        - emergency generator
        - microgrid
        - transformer replacement
    permitting:
      label: Electrical permitting support
      strong:
        - electrical permit
        - electrical permitting
        - permit drawings
        - permit set
        - plan check
        - permitting services
      weak:
        - ev charging
        - ev chargers
        - tenant improvement
        - interconnection
    forensics:
      label: Electrical forensics & expert witness
      strong:
        - forensic
        - forensics
        - expert witness
        - failure analysis
        - fire investigation
        - electrical fire
        - root cause analysis
        - electrical failure
        - litigation support
        - electrocution
        - arc fault
      weak:
        - equipment failure
        - fire cause
        - transformer fire
        - transformer explosion
        - power outage investigation
        - insurance claim
    "179d":
      label: Section 179D certification
      # P.L. 119-21 sec. 70507: no deduction for property whose construction
      # begins after 2026-06-30. The certifier must also be licensed in the
      # state where the building is located (IRS Notice 2006-52).
      note: >-
        179D only applies if construction began on or before 2026-06-30, and
        the certifier must be licensed in the building's state.
      penalize_if:
        reason: 179D cutoff risk (construction may start after 2026-06-30)
        points: 25
        terms:
          - proposed
          - planned
          - plans to
          - groundbreaking
          - will break ground
          - breaks ground
          - broke ground
          - design phase
      strong:
        - "179d"
        - energy efficient commercial building
        - energy efficient commercial buildings deduction
      weak:
        - lighting retrofit
        - led retrofit
        - hvac upgrade
        - hvac replacement
        - building envelope
        - energy retrofit
        - energy efficiency upgrade
        - energy savings performance contract
        - espc

  # SAM.gov NAICS codes that count as one weak service hit.
  naics_weak:
    - "541330"   # Engineering services
    - "541350"   # Building inspection services
    - "541690"   # Other scientific and technical consulting
    - "238210"   # Electrical contractors

  # Hard excludes: anything matching scores 0. These are the common noise
  # patterns for these keywords: PPE purchases, training, market-research
  # press releases, job ads, single-family residential.
  exclude:
    - arc flash suit
    - arc flash suits
    - arc flash clothing
    - arc flash kit
    - arc flash kits
    - fr clothing
    - apparel
    - arc flash training
    - nfpa 70e training
    - training course
    - training courses
    - webinar
    - certification class
    - market size
    - market report
    - market research
    - market analysis
    - cagr
    - job opening
    - now hiring
    - we are hiring
    - single family
    - homeowner
    - homeowners
    - obituary

  # Excluded only on procurement notices (SAM.gov), where they mean someone is
  # buying PPE or training. In news ("OSHA cited the plant for failing to
  # provide PPE") the same words are a lead, not noise.
  exclude_procurement:
    - ppe
    - gloves
    - flame resistant
    - electrical safety training
    - training services

  # Incident or enforcement wording. Matching leads are flagged in the digest,
  # and drafts never quote the headline or mention the incident, citation or
  # people involved. Nobody wants their OSHA citation read back to them.
  sensitive_terms:
    - cited
    - cites
    - citation
    - citations
    - violations
    - fined
    - penalties
    - killed
    - fatal
    - fatality
    - fatally
    - died
    - death
    - injured
    - injury
    - injuries
    - burned
    - hospitalized
    - electrocuted
    - electrocution

  # Target segments: a score bonus, a label in the digest, and their own pitch.
  # A lead joins a segment when it is in one of `states` and matches a
  # `facility_terms` entry. Company size can't be read from a headline, so
  # judge "small" yourself in the digest.
  segments:
    il_manufacturing:
      label: Illinois manufacturer (in-house study review)
      states: [IL]
      bonus: 10
      service_line: arc_flash
      facility_terms:
        - manufacturer
        - manufacturers
        - manufacturing
        - factory
        - plant
        - fabrication
        - fabricator
        - machine shop
        - machining
        - foundry
        - stamping
        - injection molding
        - plastics
        - food processing
        - packaging plant
        - assembly plant
        - production line
        - production facility
      # Count as direct (strong) arc flash evidence inside the segment only.
      strong_terms:
        - electrical hazards
        - electrical hazard
        - electrical safety violations
        - electrical violations
      # Count as weak evidence inside the segment only: changes that make an
      # existing study stale.
      weak_terms:
        - expansion
        - expands
        - new production line
        - new equipment
        - new facility
        - osha
      template: study_review
      pitch: >-
        Offer an independent review of the facility's existing arc flash study,
        which may have been done in-house: system data and inputs, the IEEE 1584
        calculation method, protective device settings, and labels, with a short
        written list of what to fix. A full study or update is the follow-on.
        Never say or imply that their staff are unqualified or that an in-house
        study is improper.

  # Competence guard: scopes Roben does not sell. Subtracts points rather than
  # excluding, because a design solicitation can still carry a study.
  penalize:
    points: 15
    terms:
      - design build
      - full design services
      - a e design services
      - architect engineer design
      - ground up design
      - design services
      - residential

  # Project-reality signals for the 0-30 "real commercial project" score.
  project_signals:
    procurement:   # +12 when present
      - solicitation
      - rfp
      - rfq
      - request for proposal
      - request for proposals
      - request for qualifications
      - invitation for bid
      - sources sought
      - bid
      - bids
      - contract awarded
      - awarded contract
    stage:         # +6 when present
      - construction
      - groundbreaking
      - approved
      - approves
      - permit
      - permits
      - expansion
      - renovation
      - retrofit
      - modernization
      - replacement
      - upgrade
      - planned
      - proposed
    facility:      # +6 when present
      - building
      - facility
      - campus
      - hospital
      - school
      - university
      - plant
      - warehouse
      - data center
      - substation
      - airport
      - courthouse
      - laboratory
      - office
    noise:         # -15 when present
      - stock
      - shares
      - earnings
      - quarterly results
      - opinion
      - op ed
      - podcast
      - how to
      - tips
  # Quantities (dollar amounts, square feet, MW, kV) add this many points.
  quantity_points: 6
  # SAM.gov notice types (by "type" field) and the project points they earn.
  notice_type_points:
    Solicitation: 15
    Combined Synopsis/Solicitation: 15
    Sources Sought: 15
    Presolicitation: 12
    Award Notice: 12
    Special Notice: 6
    Justification: 0
    Sale of Surplus Property: 0
    Intent to Bundle Requirements (DoD-Funded): 0

sources:
  sam_gov:
    # Off until a SAM.gov API key is set up. To turn on: set this to true and
    # export SAM_API_KEY (SAM.gov > Profile > Account Details > Public API Key).
    enabled: false
    api_key_env: SAM_API_KEY
    # One search request per state per run (plus pagination). A personal key
    # with no SAM.gov role is limited to 10 requests/day; raise this only if
    # your account has a role. Keys expire every 90 days.
    daily_request_budget: 10
    lookback_days: 3       # window used on the first run
    max_window_days: 30
    page_size: 1000
    timeout_seconds: 60
    # Notice descriptions are a separate request each. Only fetched for leads
    # that already show a service-line hit, up to this many per run.
    description_budget: 5

  news_rss:
    enabled: true
    lookback_days: 2
    max_window_days: 7
    timeout_seconds: 30
    # Google News RSS search queries. Edit freely; each is one request per run.
    google_news_queries:
      - '"arc flash" OR "short circuit study" OR "coordination study" (California OR Illinois OR Florida)'
      - '("switchgear" OR "substation" OR "electrical upgrade") (hospital OR campus OR "data center" OR plant) (California OR Illinois OR Florida)'
      - '"electrical fire" (investigation OR cause) (warehouse OR building OR plant OR facility) (California OR Illinois OR Florida)'
      - '"battery energy storage" project approved (California OR Illinois OR Florida)'
      - '"179D" OR "energy efficient commercial building" deduction'
      - '"data center" construction approved (California OR Illinois OR Florida)'
      # Illinois manufacturing segment
      - 'OSHA (cited OR citations OR fines) Illinois (manufacturer OR plant OR factory) electrical'
      - '"arc flash" Illinois (manufacturer OR plant OR factory)'
      - 'Illinois manufacturer ("plant expansion" OR "new production line" OR "new facility")'
    # Extra RSS/Atom feed URLs (e.g. a local business journal). Optional.
    feeds: []

drafting:
  use_llm: true                 # falls back to templates if no API key
  model: claude-opus-5-5
  effort: medium
  max_drafts_per_run: 15
